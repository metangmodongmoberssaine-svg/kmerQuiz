spring.application.name=KmerQuiz
server.port=8009

spring.datasource.url=jdbc:mysql://localhost:3306/kmerquiz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
spring.jackson.time-zone=Africa/Douala

spring.jwt.secret=${JWT_SECRET:0x0A0B0C0D0E0F10111213141516171819}
spring.jwt.expiration=${JWT_EXPIRATION:3600000}
spring.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

app.admin.pseudo=${ADMIN_PSEUDO:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3002,http://localhost:8080,http://localhost:8009,http://localhost:8000,http://localhost:8001,http://localhost:8002,http://localhost:8003,http://localhost:8004,http://localhost:8005,http://localhost:8006,http://localhost:8007,http://localhost:8008}