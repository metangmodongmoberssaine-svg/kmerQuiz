spring.application.name=KmerQuiz
server.port=8009

spring.datasource.url=jdbc:mysql://localhost:3306/kmerquiz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
spring.jackson.time-zone=Africa/Douala
